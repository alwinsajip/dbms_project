<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Consolas, monospace" font-size="11">
  <style>
    .actor { fill: #c62828; stroke: #b71c1c; stroke-width: 1.5; rx: 4; ry: 4; }
    .text-actor { fill: #fff; font-size: 10; text-anchor: middle; font-weight: bold; }
    .line { stroke: #bbb; stroke-width: 1; stroke-dasharray: 4,3; }
    .arrow-right { stroke: #c62828; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
    .arrow-left { stroke: #2e7d32; stroke-width: 1.5; fill: none; marker-end: url(#arrow-green); }
    .note { fill: #ffebee; stroke: #ef9a9a; stroke-width: 1; rx: 3; ry: 3; }
    .text-note { font-size: 9; fill: #c62828; }
    .text-label { font-size: 9; fill: #333; }
  </style>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="400" y="25" font-size="14" font-weight="bold" text-anchor="middle">FIG. 4 — Automatic Rollback Sequence (Scenario D)</text>

  <!-- Actors -->
  <rect x="30" y="50" width="90" height="28" class="actor"/>
  <text x="75" y="68" class="text-actor">TWM</text>
  <rect x="160" y="50" width="90" height="28" class="actor"/>
  <text x="205" y="68" class="text-actor">CVS</text>
  <rect x="290" y="50" width="90" height="28" class="actor"/>
  <text x="335" y="68" class="text-actor">RRC</text>
  <rect x="420" y="50" width="90" height="28" class="actor" fill="#1a73e8"/>
  <text x="465" y="68" class="text-actor">DO</text>
  <rect x="550" y="50" width="90" height="28" class="actor" fill="#e8451c"/>
  <text x="595" y="68" class="text-actor">Production</text>
  <text x="595" y="78" class="text-actor" font-size="8" fill="#e8451c">Database</text>

  <!-- Lifelines -->
  <line x1="75" y1="78" x2="75" y2="480" class="line"/>
  <line x1="205" y1="78" x2="205" y2="480" class="line"/>
  <line x1="335" y1="78" x2="335" y2="480" class="line"/>
  <line x1="465" y1="78" x2="465" y2="480" class="line"/>
  <line x1="595" y1="78" x2="595" y2="480" class="line"/>

  <!-- 1. Deploy -->
  <rect x="380" y="95" width="170" height="20" class="note" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="465" y="109" class="text-note" fill="#2e7d32">Candidate deployed to production</text>

  <!-- 2. Monitor -->
  <rect x="35" y="130" width="80" height="30" class="note" fill="#e8f0fe" stroke="#90caf9"/>
  <text x="75" y="144" class="text-note" fill="#1a73e8">Poll workload</text>
  <text x="75" y="155" class="text-note" fill="#1a73e8">signatures</text>
  <path d="M 75,165 L 335,165" class="arrow-right"/>
  <text x="205" y="160" class="text-label" font-size="8">workload.update (every N seconds)</text>

  <!-- 3. Detect regression -->
  <rect x="290" y="180" width="90" height="35" class="note"/>
  <text x="335" y="194" class="text-note">p95 latency 50ms</text>
  <text x="335" y="206" class="text-note">vs baseline 5ms</text>
  <text x="335" y="218" class="text-note">Ratio: 10x > 1.3x threshold</text>

  <!-- 4. Fetch rollback plan -->
  <path d="M 335,230 L 205,230" class="arrow-left"/>
  <text x="270" y="225" class="text-label" font-size="8">get prior snapshot</text>
  <path d="M 205,245 L 335,245" class="arrow-right"/>
  <text x="270" y="240" class="text-label" font-size="8">inverse DDL + prior config</text>

  <!-- 5. Execute rollback -->
  <rect x="290" y="260" width="90" height="25" class="note"/>
  <text x="335" y="274" class="text-note">Execute inverse DDL</text>
  <text x="335" y="286" class="text-note">in reverse order</text>
  <path d="M 335,290 L 595,290" class="arrow-right"/>
  <text x="465" y="285" class="text-label" font-size="8">DROP INDEX / ALTER TABLE ...</text>

  <!-- 6. Confirm -->
  <path d="M 595,305 L 335,305" class="arrow-left"/>
  <text x="465" y="300" class="text-label" font-size="8">rollback DDL applied</text>

  <!-- 7. Log -->
  <rect x="290" y="320" width="90" height="30" class="note"/>
  <text x="335" y="334" class="text-note">Save RollbackEvent</text>
  <text x="335" y="346" class="text-note">to CVS</text>
  <path d="M 335,355 L 205,355" class="arrow-right"/>
  <text x="270" y="350" class="text-label" font-size="8">rollback record saved</text>

  <!-- 8. Verify recovery -->
  <path d="M 75,375 L 335,375" class="arrow-right"/>
  <text x="205" y="370" class="text-label" font-size="8">workload.update (post-rollback)</text>
  <rect x="290" y="390" width="90" height="25" class="note" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="335" y="404" class="text-note" fill="#2e7d32">Verify metrics</text>
  <text x="335" y="416" class="text-note" fill="#2e7d32">returned to baseline</text>

  <!-- Timing -->
  <rect x="30" y="440" width="720" height="30" fill="#f5f5f5" rx="3"/>
  <text x="40" y="458" font-size="9" fill="#666">Detection → Rollback complete: ~30 seconds (configurable). Zero manual steps. Full diagnostic bundle saved to CVS.</text>
</svg>
