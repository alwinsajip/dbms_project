<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Consolas, monospace" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.5; rx: 6; ry: 6; }
      .box-dark { fill: #1a73e8; stroke: #0d47a1; stroke-width: 1.5; rx: 6; ry: 6; }
      .text-title { fill: #fff; font-size: 13; font-weight: bold; text-anchor: middle; }
      .text-label { fill: #333; font-size: 11; text-anchor: middle; }
      .text-sub { fill: #666; font-size: 9; text-anchor: middle; }
      .line { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .line-dash { stroke: #888; stroke-width: 1.5; fill: none; stroke-dasharray: 5,4; }
    </style>
  </defs>

  <!-- Title -->
  <text x="450" y="25" font-size="16" font-weight="bold" text-anchor="middle">FIG. 1 — SEDBMS System Architecture</text>

  <!-- 1. TWM -->
  <rect x="320" y="45" width="180" height="55" class="box"/>
  <text x="410" y="67" class="text-label" font-weight="bold">1. Telemetry &amp; Workload</text>
  <text x="410" y="82" class="text-label" font-weight="bold">Monitor (TWM)</text>
  <text x="410" y="95" class="text-sub">pg_stat_statements · psutil · anomalies</text>

  <!-- Arrow TWM -> CGE -->
  <line x1="410" y1="100" x2="410" y2="140" class="line"/>
  <text x="420" y="124" class="text-sub" font-size="8">workload signatures</text>

  <!-- 2. CGE -->
  <rect x="320" y="140" width="180" height="55" class="box"/>
  <text x="410" y="162" class="text-label" font-weight="bold">2. Candidate Generation</text>
  <text x="410" y="177" class="text-label" font-weight="bold">Engine (CGE)</text>
  <text x="410" y="190" class="text-sub">5 strategy modules · scoring</text>

  <!-- Arrow CGE -> DTO -->
  <line x1="500" y1="167" x2="620" y2="167" class="line"/>
  <text x="565" y="162" class="text-sub" font-size="8">candidate configs</text>

  <!-- 3. DTO -->
  <rect x="620" y="140" width="180" height="55" class="box"/>
  <text x="710" y="162" class="text-label" font-weight="bold">3. Digital Twin</text>
  <text x="710" y="177" class="text-label" font-weight="bold">Orchestrator (DTO)</text>
  <text x="710" y="190" class="text-sub">provision · apply · destroy</text>

  <!-- Arrow DTO -> VCE -->
  <line x1="710" y1="195" x2="710" y2="235" class="line"/>

  <!-- 4. VCE -->
  <rect x="620" y="235" width="180" height="55" class="box"/>
  <text x="710" y="257" class="text-label" font-weight="bold">4. Validation &amp; Correctness</text>
  <text x="710" y="272" class="text-label" font-weight="bold">Engine (VCE)</text>
  <text x="710" y="285" class="text-sub">correctness · performance · report</text>

  <!-- Arrow VCE -> DO -->
  <path d="M 710,290 L 710,330" class="line"/>

  <!-- 5. DO -->
  <rect x="620" y="330" width="180" height="55" class="box"/>
  <text x="710" y="352" class="text-label" font-weight="bold">5. Deployment</text>
  <text x="710" y="367" class="text-label" font-weight="bold">Orchestrator (DO)</text>
  <text x="710" y="380" class="text-sub">blue/green · health check</text>

  <!-- Arrow DO -> RRC -->
  <path d="M 710,385 L 710,425" class="line"/>

  <!-- 6. RRC -->
  <rect x="620" y="425" width="180" height="55" class="box"/>
  <text x="710" y="447" class="text-label" font-weight="bold">6. Rollback &amp; Regression</text>
  <text x="710" y="462" class="text-label" font-weight="bold">Controller (RRC)</text>
  <text x="710" y="475" class="text-sub">regression detection · auto-revert</text>

  <!-- Arrow RRC -> CVS -->
  <path d="M 620,452 L 500,452" class="line"/>
  <text x="560" y="448" class="text-sub" font-size="8">rollback config</text>

  <!-- 7. CVS (center right) -->
  <rect x="320" y="425" width="180" height="55" class="box"/>
  <text x="410" y="447" class="text-label" font-weight="bold">7. Config Version</text>
  <text x="410" y="462" class="text-label" font-weight="bold">Store (CVS)</text>
  <text x="410" y="475" class="text-sub">SQLite · append-only · history</text>

  <!-- CVS connections -->
  <line x1="410" y1="425" x2="410" y2="195" class="line-dash"/>
  <text x="395" y="315" class="text-sub" font-size="8" transform="rotate(-90,395,315)">all services read/write</text>

  <!-- 8. Policy (cross-cutting, top right) -->
  <rect x="620" y="45" width="180" height="55" class="box-dark"/>
  <text x="710" y="67" class="text-title">8. Policy &amp; Constraint</text>
  <text x="710" y="82" class="text-title">Engine</text>
  <text x="710" y="95" class="text-sub" fill="#ddd">guardrails · budgets · SLAs</text>

  <!-- Policy connections -->
  <line x1="620" y1="72" x2="500" y2="72" class="line-dash"/>
  <line x1="620" y1="72" x2="620" y2="140" class="line-dash"/>
  <text x="560" y="68" class="text-sub" font-size="8">policy checks</text>

  <!-- 9. API -->
  <rect x="20" y="330" width="180" height="55" class="box"/>
  <text x="110" y="352" class="text-label" font-weight="bold">9. Control-Plane API</text>
  <text x="110" y="367" class="text-label" font-weight="bold">&amp; Dashboard</text>
  <text x="110" y="380" class="text-sub">REST API · React UI</text>

  <!-- API connections -->
  <line x1="200" y1="357" x2="320" y2="357" class="line-dash"/>
  <text x="265" y="353" class="text-sub" font-size="8">reads all services</text>

  <!-- Production DB -->
  <rect x="20" y="425" width="180" height="55" class="box" stroke="#e8451c"/>
  <text x="110" y="447" class="text-label" font-weight="bold" fill="#e8451c">Production Database</text>
  <text x="110" y="462" class="text-label" fill="#e8451c">PostgreSQL 18</text>
  <text x="110" y="475" class="text-sub">target · port 5432</text>

  <path d="M 110,425 L 110,380" class="line" stroke="#e8451c"/>
  <path d="M 200,452 L 320,452" class="line-dash"/>

  <!-- Legend -->
  <rect x="20" y="520" width="860" height="70" fill="#f5f5f5" rx="4" ry="4"/>
  <text x="30" y="540" font-weight="bold" font-size="11">Legend:</text>
  <line x1="30" y1="558" x2="80" y2="558" class="line"/>
  <text x="85" y="562" class="text-sub" font-size="10">Data flow (candidates, reports, events)</text>
  <line x1="30" y1="575" x2="80" y2="575" class="line-dash"/>
  <text x="85" y="579" class="text-sub" font-size="10">Control / read flow (policy checks, CVS reads)</text>
</svg>
